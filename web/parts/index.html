title: Parts Catalog
layout: content
description: Browse and search the community parts catalog
---

{% include nav_projects.html %}

<link rel="stylesheet" href="/assets/css/project-editor.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="/assets/css/parts-catalog.css?v={{ site.time | date: '%s' }}">

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
    <div>
      <h1 class="mb-1"><i class="fas fa-cubes me-3 text-primary"></i> Parts Catalog</h1>
      <p class="text-muted mb-0">A shared, community-edited catalog of the parts we use in projects.</p>
    </div>
    <div>
      <a href="/parts/edit.html?new=1" id="new-part-btn" class="btn btn-sm btn-outline-primary d-none">
        <i class="fas fa-plus me-1"></i> New part
      </a>
    </div>
  </div>

  <div id="parts-catalog"></div>
</div>

<script src="/assets/js/project-auth.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/parts-catalog.js?v={{ site.time | date: '%s' }}"></script>
<script>
(function() {
  const API = 'https://projects.kevsrobots.com';
  const newBtn = document.getElementById('new-part-btn');

  // Issue #265: the catalog, a shelf per category. ?category= and
  // ?family= (from a part page's chips) and ?q= start it filtered.
  const params = new URLSearchParams(window.location.search);
  PartsCatalog.mount(document.getElementById('parts-catalog'), {
    api: API,
    initial: { category: params.get('category'), family: params.get('family'), query: params.get('q') || '' },
  });

  // Show the "New part" button if the user is logged in (server enforces age).
  async function checkAuth() {
    try {
      const resp = await ProjectAuth.apiFetch(API + '/api/projects/my/list');
      if (resp.ok) newBtn.classList.remove('d-none');
    } catch (_) {}
  }
  checkAuth();
})();
</script>
