<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Reset your password · kevsrobots</title>
  <noscript><meta http-equiv="refresh" content="0; url={{ site.accounts_url }}/reset-password"></noscript>
  <script>
    // One sign-in for every kevsrobots app lives on the accounts site (kevsrobots.com#581, Chatter#81).
    // Forward there, keeping return_to (made absolute, so Chatter sends people back to this site) and error.
    (function () {
      var here = new URLSearchParams(window.location.search);
      var out = new URLSearchParams();
      var back = here.get('return_to');
      if (back) {
        if (back.charAt(0) === '/' && back.charAt(1) !== '/') back = window.location.origin + back;
        out.set('return_to', back);
      }
      if (here.get('username')) out.set('username', here.get('username'));
      var query = out.toString();
      window.location.replace('{{ site.accounts_url }}/reset-password' + (query ? '?' + query : ''));
    })();
  </script>
</head>
<body>
  <p><a href="{{ site.accounts_url }}/reset-password">Continue to reset your password</a></p>
</body>
</html>
