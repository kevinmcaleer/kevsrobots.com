
{% assign posts = site.posts %}
<link rel="stylesheet" href="/assets/css/blog-cards.css?v={{ site.time | date: '%s' }}">

<div class="row">
<div class="col-md-9 col-12">
    <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4 animate-on-scroll blog-cards">
        {% for post in posts limit:4 %}
        {% include blog_listing_card.html post=post %}
        {% endfor %}
        </div>
</div>
<div class="col-12 col-md-3">
    {% include blog_archive.html %}
</div>
</div>
