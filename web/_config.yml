title: KevsRobots
email: kevinmcaleer@gmail.com
description: This is the official website of Kevin McAleer
baseurl: ""
url: "https://www.kevsrobots.com"

# Where people sign in (kevsrobots suite, kevinmcaleer/Chatter#81). /login, /register and /reset-password forward
# here. chatter.kevsrobots.com forwards on to accounts.kevsrobots.com once Chatter's ACCOUNTS_URL is set, so this can
# change to https://accounts.kevsrobots.com later without breaking anything in between.
accounts_url: "https://chatter.kevsrobots.com"

markdown: kramdown
permalink: /blog/:title:output_ext

kramdown:
  toc_levels: 1..6

plugins:
  - jekyll-redirect-from
  # - jekyll-toc

# Compression settings for production
# TEMPORARILY DISABLED - may be breaking footer
# compress_html:
#   clippings: all
#   comments: all
#   endings: all
#   startings: []
#   blanklines: false
#   profile: false

# Environment-specific settings
environment: production

# Site timezone for events and schedules
site_timezone: "Europe/London"

webserver_headers:
  - - Access-Control-Allow-Origin
    - "*"
  - - Access-Control-Allow-Methods
    - GET, OPTIONS, HEAD

