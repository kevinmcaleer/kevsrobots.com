{% comment %} jekyll-redirect-from passes page.redirect as {from, to}; plain string kept for older pages {% endcomment %}{% assign target = page.redirect.to | default: page.redirect %}<html>
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="refresh" content="0;url={{ target }}"/>
        <link rel="canonical" href="{{ target }}"/>
        <script type="text/javascript">
                window.location.href = "{{ target }}"
        </script>
        <title>Page Redirection</title>
    </head>
    <body>
    If you are not redirected automatically, follow <a href='{{ target }}'>this link</a>.
    <script>location='{{ target }}'</script>
    </body>
    </html>
