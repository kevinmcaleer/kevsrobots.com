---
layout: default
title: User Profile
---

<link rel="stylesheet" href="/assets/css/kr-project-card.css?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="/assets/css/profile.css?v={{ site.time | date: '%s' }}">

<div class="kr-profile" id="profile-root">
  <div class="kr-profile-banner" id="profile-banner"></div>

  <header class="kr-profile-head">
    <div class="kr-profile-avatar" id="profile-avatar" aria-hidden="true"></div>
    <div class="kr-profile-id">
      <h1 id="profile-name">&nbsp;</h1>
      <p class="kr-profile-handle"><span id="profile-username"></span><span id="profile-location" hidden> · <span id="location-text"></span></span></p>
    </div>
    <div class="kr-profile-actions" id="profile-actions">
      <button type="button" id="follow-btn" class="krc-follow kr-profile-follow" aria-pressed="false" hidden>Follow</button>
      <a id="edit-profile-button" class="kr-profile-btn" href="/account" hidden>Edit profile</a>
      <button type="button" id="share-profile-btn" class="kr-profile-btn" aria-haspopup="true" aria-expanded="false">Share profile</button>
    </div>
  </header>

  <div class="kr-profile-meta">
    <p id="profile-bio" class="kr-profile-bio" hidden></p>

    <div class="kr-profile-stats" id="profile-stats">
      <span><b id="stat-projects">0</b> Projects</span>
      <span><b id="stat-likes">0</b> Likes</span>
      <button type="button" id="stat-followers-btn"><b id="stat-followers">0</b> Followers</button>
      <button type="button" id="stat-following-btn"><b id="stat-following">0</b> Following</button>
      <span id="profile-joined"></span>
    </div>

    <div class="kr-profile-links">
      <a id="profile-website" hidden target="_blank" rel="noopener noreferrer nofollow"></a>
      <span id="profile-socials"></span>
    </div>

    <div class="kr-profile-builds" id="profile-builds" hidden>
      <span class="kr-profile-label-inline">Builds with</span>
    </div>

    <div class="kr-profile-badges" id="badges-list" hidden></div>
  </div>

  <section class="kr-profile-section" id="pinned-section" hidden aria-labelledby="pinned-title">
    <h2 class="kr-profile-label" id="pinned-title">Pinned</h2>
    <div class="krc-grid kr-profile-pinned" id="pinned-grid"></div>
  </section>

  <section class="kr-profile-section" id="courses-section" hidden aria-labelledby="courses-title">
    <h2 class="kr-profile-label" id="courses-title">Courses finished</h2>
    <div class="kr-profile-courses" id="courses-list"></div>
  </section>

  <section class="kr-profile-section">
    <div class="kr-profile-tabs" role="tablist" aria-label="Profile">
      <button type="button" role="tab" id="tab-projects-btn" aria-selected="true" aria-controls="tab-projects">Projects <span class="kr-tab-n" id="tab-projects-n"></span></button>
      <button type="button" role="tab" id="tab-makes-btn" aria-selected="false" aria-controls="tab-makes" tabindex="-1">Makes <span class="kr-tab-n" id="tab-makes-n"></span></button>
      <button type="button" role="tab" id="tab-activity-btn" aria-selected="false" aria-controls="tab-activity" tabindex="-1">Activity</button>
      <button type="button" role="tab" id="tab-liked-btn" aria-selected="false" aria-controls="tab-liked" tabindex="-1" hidden>Liked</button>
    </div>

    <div role="tabpanel" id="tab-projects" aria-labelledby="tab-projects-btn">
      <div class="kr-profile-filters">
        <div class="kr-profile-chips" id="project-filters" role="group" aria-label="Made with">
          <button type="button" aria-pressed="true" data-filter="all">All</button>
          <button type="button" aria-pressed="false" data-filter="snakie" hidden><span class="kr-tab-dot kr-tab-snakie" aria-hidden="true"></span>Snakie</button>
          <button type="button" aria-pressed="false" data-filter="bettercad" hidden><span class="kr-tab-dot kr-tab-bettercad" aria-hidden="true"></span>BetterCAD</button>
        </div>
        <div class="kr-profile-sort" role="group" aria-label="Sort">
          Sort:
          <button type="button" aria-pressed="true" data-sort="newest">Newest</button>
          <button type="button" aria-pressed="false" data-sort="liked">Most liked</button>
        </div>
      </div>
      <div id="projects-grid" class="krc-grid" aria-busy="true">
        <div class="krc-skeleton"></div><div class="krc-skeleton"></div><div class="krc-skeleton"></div>
      </div>
      <p id="projects-empty" class="kr-profile-empty" hidden>No public projects yet.</p>
    </div>

    <div role="tabpanel" id="tab-makes" aria-labelledby="tab-makes-btn" hidden>
      <div id="makes-grid" class="kr-profile-makes"></div>
      <p id="makes-empty" class="kr-profile-empty" hidden>No makes posted yet.</p>
    </div>

    <div role="tabpanel" id="tab-activity" aria-labelledby="tab-activity-btn" hidden>
      <ul id="activity-list" class="kr-profile-activity"></ul>
      <p id="activity-empty" class="kr-profile-empty" hidden>No recent activity to show.</p>
      <h3 class="kr-profile-label">Recent comments</h3>
      <div id="comments-list" class="kr-profile-comments"></div>
    </div>

    <div role="tabpanel" id="tab-liked" aria-labelledby="tab-liked-btn" hidden>
      <div id="liked-grid" class="krc-grid"></div>
      <p id="liked-empty" class="kr-profile-empty" hidden>No liked projects yet.</p>
    </div>
  </section>
</div>

<!-- Followers/following modal -->
<div class="modal fade" id="user-list-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="user-list-title">Followers</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="user-list-loading" class="text-center py-3">
          <div class="spinner-border spinner-border-sm" role="status"></div>
        </div>
        <ul id="user-list-list" class="list-unstyled mb-0 d-none"></ul>
        <div id="user-list-empty" class="text-muted small mb-0 d-none">Nobody here yet.</div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/project-auth.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/kr-project-card.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/profile-page.js?v={{ site.time | date: '%s' }}"></script>
