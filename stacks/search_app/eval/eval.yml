# Golden questions for measuring retrieval quality.
#
# Written the way people actually type: short, lowercase, a bit lazy. An
# evaluation set of beautifully phrased questions measures a tool nobody uses.
#
# `expect` is a URL prefix - a hit counts if any returned URL starts with it,
# so a course-level answer counts wherever in that course it lands.
# `expect: null` means the site genuinely cannot answer; a good result is
# nothing useful coming back.
#
# Deliberately includes questions whose wording shares no keywords with the
# target page - those are the ones that separate semantic search from BM25.

# --- Semantic: different words to the page ----------------------------------
- question: robot that draws pictures on a wall
  expect: learn/scrawly_wally/
  note: the page says "plotter" and "drawing robot", not "draws pictures"

- question: machine that makes burgers
  expect: learn/burgerbot/

- question: how do I put my notes into an AI so it can answer questions about them
  expect: learn/obsidian_rag/

- question: run containers on a pi
  expect: learn/docker/

- question: teach a computer to learn by trial and error
  expect: learn/reinforcement_learning/

- question: how do I read how hot the chip is
  expect: learn/pico_temp_sensor/

- question: mesh networking off the grid
  expect: learn/meshcore/

