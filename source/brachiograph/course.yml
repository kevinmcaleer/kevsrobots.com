    - section:
        name: Build the plotter
        content:
          - 01_build.md
          - 02_wire.md
    - section:
        name: Programming
        content:
          - 03_setup_pi.md
          - 04_code.md
          - 05_draw.md
          - 06_vectorize.md
    - section:
        name: Summary
