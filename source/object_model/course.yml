- name: Building Object Detection Models with Raspberry Pi AI Camera
  author: Kevin McAleer
  date_created: 2025-12-04
  date_published: 2025-12-04
  level: intermediate
  layout: course
  cover: assets/cover.jpg
  video: ARCtzjHfyMg
  outcomes:
      - Explain what an object detection model does and how a camera sees bounding boxes and confidence scores
      - Collect and label a small image dataset and lay it out the way YOLO training expects
      - Fine-tune a pre-trained YOLO model on your own objects with transfer learning
      - Export and quantise the model, then package it for the Raspberry Pi AI Camera (IMX500)
      - Run the model on the camera from Python with Picamera2 and react to what it sees
      - Measure, diagnose and improve a detector that misses things or sees things that are not there
  prerequisites:
      - Basic Python (variables, loops, functions), as in the Python course
      - Comfortable typing commands in a terminal, as in the Linux intro course
  you_need:
      - A Raspberry Pi 5 or Raspberry Pi 4 running Raspberry Pi OS
      - A Raspberry Pi AI Camera (Sony IMX500)
      - A computer to train on, with Python 3.10 to 3.12 (Linux, or Windows with WSL, for the export step)
      - A phone or webcam to photograph your objects, and 30 to 60 minutes per lesson
  groups:
      - python
      - ai
      - raspberrypi
  description: >-
      Learn how to build custom object detection models using the Raspberry Pi AI Camera.
      Train your own models with PyTorch, optimize them for edge deployment, and run
      real-time detection on Raspberry Pi hardware. Complete hands-on course from dataset
      creation to production deployment.
  content:
  - section:
      name: Getting Started
      content:
      - 00_intro.md
      - 01_setup.md
  - section:
      name: Dataset Preparation
      content:
      - 02_dataset_prep.md
  - section:
      name: Model Training
      content:
      - 03_training.md
      - 04_onnx_conversion.md
  - section:
      name: Deployment
      content:
      - 05_deployment.md
      - 06_realtime_detection.md
  - section:
      name: Advanced Topics
      content:
      - 07_troubleshooting.md
      - 08_summary.md
  
