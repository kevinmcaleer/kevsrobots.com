- name: "Coding Faster in Snakie"
  author: Kevin McAleer
  date_created: 2026-11-21
  date_published: 2026-11-21
  level: intermediate
  layout: course
  cover: assets/cover.jpg
  groups:
      - micropython
      - pico
      - python
  description: >-
    Get more from Snakie's editor. Use MicroPython-aware autocomplete, hover help, linting and one-click refactors, install packages, compile to .mpy and keep your project under Git, then put it all to work on an ultrasonic sensor driver.
  outcomes:
    - Write MicroPython with fewer trips to the documentation
    - Read the Problems panel and fix what it finds
    - Apply a refactoring safely, with a preview of every change
    - Decide whether a library needs installing or is already on the board
    - Shrink a module by compiling it to .mpy
    - Commit your work in Git and see exactly what changed since
  prerequisites:
    - Getting Started with Snakie
    - Learn MicroPython - The basics, or the ability to write a short MicroPython program with functions and a loop
  you_need:
    - Snakie, in your browser or the desktop app
    - The Snakie desktop app for the linting, Git, AI chat and full menus lessons
    - Git installed on your computer (for the version control lesson)
    - No hardware needed. A Raspberry Pi Pico is useful for the packages lesson
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Writing
      content:
      - 01_smart_autocomplete.md
      - 02_hover_help_and_definitions.md
      - 03_find_and_replace.md
  - section:
      name: Checking
      content:
      - 04_linting_and_problems.md
      - 05_micropython_refactors.md
      - 06_yaml_and_json.md
  - section:
      name: Libraries
      content:
      - 07_installing_packages.md
      - 08_the_modules_shelf.md
      - 09_compiling_to_mpy.md
  - section:
      name: Working Like a Pro
      content:
      - 10_version_control_with_git.md
      - 11_ai_chat_and_suggestions.md
      - 12_menus_and_shortcuts.md
  - section:
      name: Project
      content:
      - 13_project_sensor_driver.md
      - 14_summary.md
