  - section:
      name: Introduction to Enigma
      content:
      - 01_lesson01.md
      - 02_lesson02.md
  - section:
      name: Bruteforce attack
      content:
      - 03_lesson03.md
      - 04_lesson04.md
  - section:
      name: Build OctaPi
      content:
