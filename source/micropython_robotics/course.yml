- name: MicroPython Robotics Projects with the Raspberry Pi Pico
  author: Kevin McAleer
  date_created: 2025-05-10
  date_published: 2025-05-20
  level: intermediate
  layout: course
  cover: assets/cover.jpg
  video: 6YqzOQ7OZkQ
  outcomes:
    - Drive two DC motors forwards, backwards and at different speeds with an L298N driver and PWM
    - Read an infrared line sensor and an HC-SR04 ultrasonic sensor, and turn the readings into decisions
    - Aim an SG90 servo by working out the pulse width for any angle
    - Control the robot from a phone over Bluetooth (HC-05) or Wi-Fi (Pico W)
    - Combine motors and sensors into an autonomous robot that avoids obstacles and follows a line
  prerequisites:
    - Learn MicroPython - The basics
    - Raspberry Pi Pico with MicroPython - GPIO Mastery
  you_need:
    - A Raspberry Pi Pico or Pico W (a Pico W for the Wi-Fi lesson) running MicroPython
    - An L298N motor driver module and two small DC gear motors with wheels
    - An HC-SR04 ultrasonic sensor, one or two TCRT5000 style IR line sensors and an SG90 servo
    - A battery pack for the motors, jumper wires and resistors (1k and 2k ohm)
    - Optional, an HC-05 Bluetooth module
  groups:
      - robots
      - micropython
      - raspberrypi
      - pico
  description: >-
    Learn how to build simple yet powerful robots using the Raspberry Pi Pico and MicroPython. 
    This hands-on course guides you through controlling motors, reading sensors, and combining hardware to create autonomous and remotely controlled robots. 
    Perfect for makers ready to go beyond GPIO and start building real-world robotics projects.
  content:
    - section:
        name: Introduction
        content:
          - 00_intro.md
    - section:
        name: Motors and Movement
        content:
          - 02_dc_motors.md
          - 03_hbridge_control.md
    - section:
        name: Sensors and Input
        content:
          - 04_line_following.md
          - 05_ultrasonic_sensor.md
    - section:
        name: Robot Assembly
        content:
          - 06_build_robot.md
          - 07_servo_scanning.md
    - section:
        name: Remote Control
        content:
          - 08_bluetooth_control.md
          - 09_wifi_control.md
    - section:
        name: Autonomous Behavior
        content:
          - 10_autonomous_robot.md
    - section:
        name: Final Project
        content:
          - 11_final_project.md
    - section:
        name: Summary
        content:
          - 12_summary.md
