          - 11_combining_senses.md
          - 12_project_reactive_robot.md
    - section:
        name: Navigation
        content:
          - 13_wall_following.md
          - 14_mapping_and_slam.md
    - section:
        name: Wrapping up
        content:
          - 15_troubleshooting.md
