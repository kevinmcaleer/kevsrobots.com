- name: Learn BetterCad
  author: Kevin McAleer
  date_created: 2026-11-20
  date_published: 2026-11-20
  level: beginner
  layout: course
  cover: assets/cover.jpg
  outcomes:
    - Design a printable part from a sketch or from ready-made shapes
    - Dimension a sketch so a hole sits exactly where you want it
    - Add screw holes that a real screw slides through on a real printer
    - Change a design by editing a named parameter instead of redrawing it
    - Check a model for overhangs and thin walls before you print it
    - Export STL, 3MF and STEP files and save an editable .bcad file
  prerequisites:
    - None. No CAD experience is needed
  you_need:
    - A computer with a recent browser. BetterCad runs in the browser with no install and no account
    - A mouse with a scroll wheel is helpful, but a trackpad is fine
    - A 3D printer and slicer are optional, if you want to print what you make
  groups:
      - 3ddesign
      - 3dprinting
  description: >-
    Design your own 3D printable parts in BetterCad, the free CAD tool that runs in your browser. Sketch, extrude, add screw holes that fit, hollow out an enclosure, drive a model with parameters, then build a phone stand from scratch.
  content:
