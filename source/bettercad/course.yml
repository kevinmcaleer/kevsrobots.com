      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Your First Part
      content:
      - 01_look_around_and_sketch.md
      - 02_extrude_and_fillet.md
      - 03_export_your_first_print.md
  - section:
      name: Sketching Properly
      content:
      - 04_sketching_with_constraints.md
      - 05_dimensions.md
  - section:
      name: Building With Shapes
      content:
