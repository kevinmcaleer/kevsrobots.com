- name: Git for Beginners
  author: Kevin McAleer
  date_created: 2026-11-04
  date_published: 2026-11-04
  level: beginner
  layout: course
  cover: assets/cover.jpg
  outcomes:
    - Install Git and set it up with your name, email and default branch
    - Save snapshots of a project with git add and git commit, and read its history
    - Undo mistakes safely with git restore, git commit --amend and git revert
    - Keep secrets and junk out of a repository with .gitignore
    - Use branches, merge them, and resolve a merge conflict
    - Publish a project on GitHub, sign in safely, and keep copies in sync with push, pull and pull requests
  prerequisites:
    - No Git or GitHub experience needed
    - Comfortable typing a command into a terminal and pressing Enter
  you_need:
    - A computer running Windows, macOS or Linux, or a Raspberry Pi
    - A text editor such as VS Code or Thonny
    - A free GitHub account (for modules 10 to 12)
    - Optional for the final project, a Raspberry Pi Pico robot with two motors and an HC-SR04 sensor
  groups:
      - productivity
      - micropython
  description: >-
     Learn to track your code and projects with Git: commits, history, undoing mistakes, branches, merging, and sharing your work on GitHub.
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Getting Started
      content:
      - 01_what-is-git.md
      - 02_installing-git.md
      - 03_your-first-repository.md
  - section:
      name: Saving Your Work
      content:
      - 04_staging-and-committing.md
      - 05_viewing-history.md
      - 06_undoing-changes.md
      - 07_ignoring-files.md
  - section:
      name: Branches
      content:
      - 08_branches.md
      - 09_merging-and-conflicts.md
  - section:
      name: Working with GitHub
      content:
      - 10_github-and-remotes.md
      - 11_pulling-and-collaborating.md
  - section:
      name: Putting It All Together
      content:
      - 12_project-version-control-a-robot.md
      - 13_cheat-sheet-and-next-steps.md
