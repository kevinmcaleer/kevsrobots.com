- name: Introduction to FreeCAD for Beginners
  author: Kevin McAleer
  date_created: 2024-04-17
  date_published: 2024-04-17
  level: beginner
  layout: course
  cover: assets/cover.png
  video: S7EoZHd03FY
  outcomes:
    - Find your way around the FreeCAD interface and move around a 3D model
    - Build simple models from Part primitives such as boxes, cylinders, spheres and cones
    - Combine and cut shapes with Fuse, Cut and Common, and soften edges with fillets and chamfers
    - Understand how assemblies and technical drawings are made from finished parts
    - Check a model and export it as STL or STEP for 3D printing and sharing
  prerequisites:
    - No CAD experience needed, just basic computer skills such as saving files and using a mouse
    - Helpful but not required, Building SMARS with FreeCAD as the next project course
  you_need:
    - A computer running Windows, macOS or Linux (a Raspberry Pi 4 or 5 works for the basics)
    - Permission to install software, or a school machine that already has FreeCAD
    - A mouse with a scroll wheel, which makes 3D navigation much easier
    - Optional, a 3D printer or print service to turn your STL files into real parts
  groups:
    - 3ddesign
    - 3dprinting
  description: >-
    This beginner's course on FreeCAD teaches you the essentials of 3D modeling with this powerful, open-source tool. From basic shapes to more complex designs, learn the fundamentals of CAD software and how to apply them in your own projects.
  content:
    - section:
        name: Getting Started with FreeCAD
        content:
          - 00_intro.md
          - 02_installing_freecad.md
          - 03_user_interface_overview.md
    - section:
        name: Basic Modeling Techniques
        content:
          - 04_creating_basic_shapes.md
          - 05_modifying_objects.md
          - 06_boolean_operations.md
    - section:
        name: Advanced Design and Assembly
        content:
          - 07_assembly_design.md
          - 08_creating_drawings.md
          - 09_exporting_models.md
    - section:
        name: Real-World Applications and Best Practices
        content:
          - 10_practical_examples.md
          - 11_tips_and_tricks.md
