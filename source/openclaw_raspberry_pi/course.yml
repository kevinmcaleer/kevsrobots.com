- name: OpenClaw on Raspberry Pi
  author: Kevin McAleer
  date_created: 2026-01-31
  date_published: 2026-01-31
  level: intermediate
  layout: course
  cover: assets/openclaw.jpg
  video: 7JtSxb7wB8c
  description: >-
    Run OpenClaw, the open-source personal AI agent, on a Raspberry Pi in Docker. Build Pi Butler,
    an always-on assistant you talk to from your phone, with its own persona, a custom skill that
    reports how the Pi is feeling, a morning brief, backups, safe upgrades and a security check.
  outcomes:
    - Explain what the OpenClaw Gateway does, and what stays on the Pi versus what goes to the AI model provider
    - Install OpenClaw on a Raspberry Pi with Docker and the official pre-built image
    - Reach the Control UI safely through an SSH tunnel, and configure models and a persona
    - Connect a Telegram bot and approve who may talk to your agent
    - Write a custom skill and schedule an automation
    - Monitor, troubleshoot, back up, upgrade and security-audit an always-on agent
  prerequisites:
    - Basic Linux command line, such as Introduction to the Linux Command Line on Raspberry Pi OS
    - Helpful but not required, the Docker course
  you_need:
    - A Raspberry Pi 4 or Pi 5 with 2 GB of RAM or more (4 GB recommended)
    - The official power supply, and a 16 GB or larger microSD card or a USB SSD
    - A network connection, Ethernet preferred
    - A computer to SSH from, and a free Telegram account on your phone
    - An API key from an AI model provider such as Anthropic or OpenAI, which is billed per use
  groups:
    - raspberrypi
    - ai
