- name: Obsidian
  author: Kevin McAleer
  date_created: 2025-08-24
  date_published: 2025-08-24
  level: beginner
  cover: assets/cover.jpg
  video: zo3mb3EeJXQ
  groups:
      - productivity
      - raspberrypi
  description: >-
     Learn how to use Obsidian for note-taking and knowledge management, by building a
     robot build log vault with linked notes, tags, properties, tasks, a canvas and a Base.
  outcomes:
    - Explain that a vault is just a folder of plain Markdown files, and create one
    - Write notes that link to each other with wikilinks, and follow backlinks
    - Organise notes with tags and properties
    - Track jobs with task checkboxes, and lay out a project on a Canvas
    - Build a Base that turns your notes into a sortable table
    - Read the graph view to find orphaned notes and clusters
  prerequisites:
    - No Obsidian or Markdown experience is needed
    - Helpful but not required, Mastering Markdown for Documentation with Jekyll
  you_need:
    - A Windows, macOS or Linux computer, or a Raspberry Pi running Raspberry Pi OS
    - An internet connection to download Obsidian
    - Optionally, a robot or electronics project to write about
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Getting Started with Obsidian
      content:
      - 01_installing.md
      - 02_first_vault.md
  - section:
      name: Taking Notes and Organization
      content:
      - 03_creating_notes.md
      - 04_tagging_notes.md
      - 05_linking_notes.md
  - section:
      name: Advanced Features
      content:
      - 06_canvas.md
      - 07_tasks.md
      - 08_dataview_and_bases.md
      - 09_properties.md
      - 12_graph_view.md
