        name: Introduction
        content:
          - 00_intro.md
    - section:
        name: Your first bus servo
        content:
          - 01_why_bus_servos.md
          - 02_parts_and_wiring.md
          - 03_the_library_and_first_move.md
          - 04_reading_feedback.md
    - section:
        name: Two servos and beyond
        content:
          - 05_servo_ids_and_chaining.md
          - 06_the_wave_demo.md
          - 07_teach_and_repeat.md
          - 08_gearing_and_choosing_servos.md
    - section:
        name: The Buddy arm
        content:
          - 09_meet_buddy.md
          - 10_calibrating_offsets.md
          - 11_smooth_synchronised_moves.md
          - 12_kinematics.md
    - section:
        name: Control panel and wrap-up
        content:
          - 13_web_control_panel.md
          - 14_troubleshooting.md
          - 15_summary.md
