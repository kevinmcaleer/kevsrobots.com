- name: Building SMARS with FreeCAD
  author: Kevin McAleer
  date_created: 2025-12-12
  date_published: 2025-12-12
  level: beginner
  layout: course
  cover: assets/cover.jpg
  video: S7EoZHd03FY
  outcomes:
    - Navigate the FreeCAD 3D view with the mouse, navigation cube and keyboard shortcuts
    - Build constrained, centred sketches and turn them into solids with Pad and Pocket
    - Hollow and round a part with Thickness and Fillet
    - Use external geometry, datum planes, Mirror, Revolve and Polar Pattern on a real robot chassis
    - Export a model as an STL file and check it in a slicer before printing
  prerequisites:
    - Basic computer skills such as working with files, folders and menus
    - No previous CAD or 3D printing experience needed
    - Helpful but not required, Introduction to FreeCAD for Beginners
  you_need:
    - A computer that can run FreeCAD 0.21 or newer (Windows, Mac or Linux)
    - A mouse with a middle button is recommended
    - Optional, a 3D printer with at least a 120mm x 100mm build area and PLA filament, or access to a makerspace or print service
  groups:
    - 3ddesign
    - 3dprinting
    - robots
  description: >-
    Learn to design a complete 3D-printable robot chassis from scratch using FreeCAD. This hands-on course teaches parametric CAD design, professional modeling techniques, and design-for-manufacturing principles while building the iconic SMARS robot base. Perfect for makers who want to design their own robot parts.
  content:
    - section:
        name: Getting Started
        content:
          - 00_intro.md
          - 01_navigation.md
    - section:
        name: Designing the SMARS Base
        content:
          - 02_creating_the_base.md
          - 03_shell_and_fillet.md
          - 04_sides_and_holes.md
          - 05_front_rear_profiles.md
          - 06_arduino_slots.md
          - 07_wheel_stubs.md
          - 08_motor_holder.md
    - section:
        name: Exporting for 3D Printing
        content:
          - 09_save_as_stl.md
    - section:
        name: Summary
        content:
          - 10_summary.md
