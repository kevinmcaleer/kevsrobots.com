- name: Python for beginners
  author: Kevin McAleer
  date_created: 2023-07-20
  date_published: 2023-07-20
  level: beginner
  layout: course
  cover: assets/python.png
  code_target: cpython
  groups:
    - python
  description: >-
     Get started with Python programming. Install Python, learn the core language
     (variables, data structures, loops, functions, files, errors, modules and classes),
     then take a guided tour of what Python does in the real world: web scraping,
     charts, machine learning, automation and databases. You finish by building
     a small quiz application.
  outcomes:
    - Install Python and run a program from an editor and from a terminal
    - Use variables, lists, dictionaries, loops, functions and classes to model a small robot
    - Read and write files, and handle errors so a program fails gracefully
    - Create a virtual environment and install libraries with pip
    - Use requests, Matplotlib, scikit-learn, sqlite3 and pathlib in small complete programs
    - Build a command line quiz application and know where to go next
  prerequisites:
    - None. This is the first course in the Python learning pathway
  you_need:
    - A computer running Windows, macOS or Linux (a Raspberry Pi 4 or 5 is perfect)
    - An internet connection to download Python and libraries
    - A code editor such as Thonny, VS Code or PyCharm
  content:
  - section:
      name: Introduction
      content:
        - 00_intro.md
        - 02_basics.md
        - 03_data_structures.md
        - 04_flow.md
        - 05_files.md
        - 06_errors.md
        - 07_libraries.md
        - 08_oop.md
        - 09_data.md
  - section:
      name: Real world Python
      content:
        - 10_webscraping.md
        - 11_data_visualisation.md
        - 12_ml.md
        - 13_deep_learning.md
        - 14_automation.md
        - 15_databases.md
        - 16_advanced.md
        - 17_apps.md
        - 18_tips_and_tricks.md
