- name: "Make Your Own Parts and Boards in Snakie"
  author: Kevin McAleer
  date_created: 2026-11-21
  date_published: 2026-11-21
  level: intermediate
  layout: course
  cover: assets/cover.jpg
  groups:
      - electronics
      - micropython
      - pico
  description: >-
    Add any sensor, breakout or microcontroller board to Snakie with the Part Editor. Draw the board, place its pins, trace a photo, attach a driver and give it its own blocks, by building a VL53L0X distance sensor part from scratch.
  outcomes:
    - Create a part in the Part Editor and save it to your My Parts library
    - Place and describe pins so Snakie can wire, check and label them
    - Turn a photo of a board into a clean, correctly sized part
    - Attach a driver so Snakie offers to install it when the part is used
    - Write a small blocks.yml that adds blocks for your part
    - Make a custom microcontroller board and share your parts as a library
  prerequisites:
    - Getting Started with Snakie
    - Wire It Up - Electronics in Snakie
    - Snakie Blocks - From Blocks to Python (for the blocks lessons)
  you_need:
    - The Snakie desktop app, because saving a part writes files to your computer
    - A board to add, such as a VL53L0X breakout, though you can follow along without owning one
    - Optional, a ruler or calipers and a photo of your board taken from straight above
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
      - 01_what_a_part_is.md
  - section:
      name: Drawing the Part
      content:
      - 02_tour_of_the_part_editor.md
      - 03_board_size_and_details.md
      - 04_pins_types_and_capabilities.md
      - 05_holes_components_and_labels.md
      - 06_tracing_a_board_photo.md
  - section:
      name: Making It Smart
      content:
      - 07_schematic_symbol_and_electrical_details.md
      - 08_drivers_and_built_in_help.md
      - 09_using_your_part_in_a_project.md
      - 10_giving_your_part_its_own_blocks.md
  - section:
      name: Boards and Sharing
      content:
      - 11_making_a_microcontroller_board.md
      - 12_sharing_your_parts.md
      - 13_summary.md
