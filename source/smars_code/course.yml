- name: Learn how to program SMARS with Arduino
  author: Kevin McAleer
  date_created: 2023-09-10
  date_published: 2023-09-10
  level: beginner
  layout: course
  cover: assets/program_smars.png
  outcomes:
    - Write, verify and upload an Arduino sketch to a SMARS robot
    - Drive SMARS forwards, backwards and turning, and control it from the keyboard with the Serial Monitor
    - Measure distance with an HC-SR04 ultrasonic sensor and use it to avoid obstacles
    - Read pitch, roll and heading from an MPU-6050 module
    - Control SMARS from a phone over Bluetooth, and sweep a servo
    - Follow a line with a TCRT5000 sensor by tuning a threshold
  prerequisites:
    - Build a SMARS Robot, the first course in the series
    - No programming experience needed
  you_need:
    - A built SMARS robot with an Arduino Uno and a Fundumoto motor shield
    - A USB cable and a computer that can run the Arduino IDE
    - Optional, one per later lesson, an HC-SR04 ultrasonic sensor, an MPU-6050 module, a Bluetooth module (HM-10 or HC-08 for iPhone), an SG90 servo and a TCRT5000 line sensor
  groups:
      - robots
      - arduino
  description: >- 
     Program your SMARS robot in Arduino C++: drive it around, avoid obstacles with an
     ultrasonic sensor, sense its position, control it over Bluetooth, move servos
     and follow a line.
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Movement
      content:
      - 01_lesson_01.md 
      - 02_lesson_02.md
  - section:
      name: Sensing
      content:
      - 03_lesson_03.md
      - 04_lesson_04.md
  - section:
      name: Control
      content:
      - 05_lesson_05.md
      - 06_lesson_06.md
      - 07_lesson_07.md