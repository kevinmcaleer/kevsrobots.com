- name: Mini-Rack 3D Design Tutorial
  author: Kevin McAleer
  date_created: 2025-02-16
  date_published: 2025-02-16
  level: beginner
  layout: course
  cover: assets/cover.jpg
  video: fJC68N9nphA
  outcomes:
    - Explain what a rack unit is and how rack hole spacing shapes the parts
    - Design printable corners, a handle and a Raspberry Pi tray in Fusion 360
    - Design a slotted top panel and a cluster panel for laser cutting
    - Export a DXF file for a laser cutter
    - Print and assemble the rack safely, with good ventilation
  prerequisites:
    - Helpful but not required, a first 3D design course such as the SMARS Fusion 360 course
  you_need:
    - A computer with Fusion 360
    - A 3D printer, or access to a print service
    - A laser cutter, makerspace or cutting service for the panels
    - 20x20mm aluminium extrusion with rack mount nuts and bolts
    - Raspberry Pis, optional, to fill the finished rack
  groups:
      - raspberrypi
      - 3ddesign
      - stands_and_cases
      - lasercutting
  description: >- 
     Design a 3D printable 10" mini-rack for your Raspberry Pi home lab.
