- name: "Snakie Instruments - Oscilloscope, Multimeter and Plotter"
  author: Kevin McAleer
  date_created: 2026-11-20
  date_published: 2026-11-20
  level: beginner
  layout: course
  cover: assets/cover.jpg
  groups:
      - micropython
      - pico
      - electronics
  description: >-
    See what your MicroPython program is really doing. Use Snakie's built-in plotter, multimeter, oscilloscope and data logger to watch sensors and signals live, then scan a room for its brightest spot with a servo and a light sensor and log the results to a file.
  outcomes:
    - Plot any value from a running program with one line of code
    - Read a pin's voltage on the Multimeter, with min, max and average
    - Read a PWM signal's frequency and duty cycle on the Oscilloscope
    - Choose the right instrument for a debugging question
    - Record a run and save it as a CSV file, or log to a file on the board
    - Build a servo and light sensor scanner and check it with three instruments
  prerequisites:
    - Getting Started with Snakie
    - Wire It Up - Electronics in Snakie (helpful, not required)
  you_need:
    - A web browser, or the Snakie desktop app
    - Nothing else for the lessons, which run on the simulated device
    - For the real project, a Raspberry Pi Pico, an SG90 servo, a photoresistor and a 10 kilohm resistor
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
      - 01_the_instrument_dock.md
      - 02_telemetry_and_live.md
  - section:
      name: The Instruments
      content:
      - 03_the_plotter.md
      - 04_the_multimeter.md
      - 05_the_oscilloscope.md
      - 06_watch_and_update.md
  - section:
      name: Blocks and Logging
      content:
      - 07_instruments_from_blocks.md
      - 08_logging_data.md
  - section:
      name: Project
      content:
      - 09_project_light_scanner.md
      - 10_summary.md
