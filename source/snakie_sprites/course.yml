        content:
          - 02_the_sprite_editor.md
          - 03_drawing_your_first_sprite.md
          - 04_frames_and_animation.md
          - 05_saving_and_exporting.md
    - section:
        name: Sprites in Code
        content:
          - 06_pixels_into_bytes.md
          - 07_a_screen_in_the_simulator.md
          - 08_putting_a_sprite_on_screen.md
          - 09_animating_the_face.md
          - 10_bigger_and_smarter.md
    - section:
        name: Going Further
        content:
          - 11_sprite_files_on_the_board.md
          - 12_a_real_oled.md
