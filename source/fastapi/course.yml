- name: Building User Authentication for Static Sites with FastAPI
  author: Kevin McAleer
  date_created: 2024-03-28
  date_published: 2024-03-28
  level: intermediate
  layout: course
  cover: assets/cover.png
  groups:
    - python
    - raspberrypi
  description: >-
    Build a robot telemetry API with Python and FastAPI: a Pico or any robot posts sensor readings, a static Jekyll dashboard shows them, and only logged-in users can switch the robot's LEDs. You will use Pydantic v2 models, SQLite, hashed passwords, signed tokens, CORS and a safe deployment.
  outcomes:
    - Build and run a FastAPI app with fastapi dev, and explain what uvicorn does
    - Validate requests with Pydantic v2 models and Annotated parameters
    - Store users and sensor readings in SQLite with a lifespan handler and a database dependency
    - Register users, hash their passwords and issue signed login tokens
    - Protect routes so only logged-in users, or only admins, can reach them
    - Let a static Jekyll page call the API with CORS, and deploy with settings from the environment
  prerequisites:
    - Python basics, such as functions, dictionaries and imports
    - Helpful but not required, the Pydantic course (Mastering Pydantic for Robust Data Validation)
    - Helpful but not required, Create Databases with Python and SQLite3
  you_need:
    - A computer with Python 3.10 or newer and a terminal
    - A text editor such as Thonny, VS Code or Snakie, and a web browser
    - Internet access to install packages with pip
    - Optional, a Raspberry Pi Pico W or other robot to act as the sensor
    - Optional, a Jekyll site, or the Docker setup from the Jekyll course
  content:
    - section:
        name: Introduction to User Authentication
        content:
          - 00_intro.md
          - 02_setting_up_the_environment.md
    - section:
        name: FastAPI and User Authentication Basics
        content:
          - 03_fastapi_intro.md
          - 04_user_authentication_flow.md
    - section:
        name: Building the Authentication API
        content:
          - 05_creating_user_models.md
          - 06_implementing_registration_and_login.md
          - 07_user_management_apis.md
    - section:
        name: Integrating with a Jekyll Site
        content:
          - 08_integrating_with_jekyll.md
          - 09_deploying_the_solution.md
          - 10_summary.md
