- name: Introduction to Rust
  author: Kevin McAleer
  date_created: 2024-03-09
  date_published: 2024-03-09
  level: intermediate
  layout: course
  cover: assets/cover.png
  video: M9LekkoQyf0
  groups:
      - pico
  description: >-
     Learn the Rust programming language from scratch, with a Python and MicroPython maker in mind. Write and run real programs on your computer, build a small web server, then set up Rust to blink an LED on the Raspberry Pi Pico.
  outcomes:
    - Install Rust and build, run and test programs with Cargo
    - Explain ownership and borrowing, and read the compiler errors they produce
    - Model robot data with structs and enums, and handle failures with Option and Result
    - Use vectors, strings, hash maps and threads safely
    - Build a small JSON web server with warp
    - Set up the Rust toolchain for the Raspberry Pi Pico and flash an LED blinker
  prerequisites:
    - Some programming experience, ideally in Python or MicroPython, such as the Learn MicroPython course
    - Comfort using a terminal or command prompt
  you_need:
    - A computer running Windows, macOS or Linux, with an internet connection
    - A text editor, such as Visual Studio Code with the rust-analyzer extension
    - For the final lesson only, an original Raspberry Pi Pico (RP2040, not Pico W or Pico 2) and a micro-USB data cable
