- name: Getting Started with C on the Raspberry Pi Pico
  author: Kevin McAleer
  date_created: 2025-06-15
  date_published: 2025-06-16
  level: beginner
  layout: course
  cover: assets/cover.jpg
  groups:
    - raspberrypi
    - pico
  description: >-
    Learn how to program the Raspberry Pi Pico using the C programming language.
    This beginner-friendly course covers the fundamentals of C, how to set up your development environment,
    and how to write simple programs that run on real hardware. By the end of the course, you'll have a
    solid grasp of programming basics and will create your first hardware project; a blinking LED.
  outcomes:
    - Read and write small C programs using variables, conditions, loops and functions
    - Install the Raspberry Pi Pico C/C++ SDK and build an example program into a .uf2 file
    - Write a CMakeLists.txt file for your own Pico project
    - Print messages from the Pico to your computer over USB serial
    - Control a GPIO pin as an output from C
    - Wire up and blink an external LED, and explain why it needs a resistor
  prerequisites:
    - No programming or electronics experience is needed
    - Comfort typing commands in a terminal helps, such as Introduction to the Linux Command Line on Raspberry Pi OS
  you_need:
    - A Raspberry Pi Pico, Pico W or Pico 2 (with headers soldered for the breadboard project)
    - A micro-USB cable for Pico and Pico W, or a USB-C cable for Pico 2 (data cable, not charge-only)
    - A computer running Windows, macOS or Linux
    - A breadboard, one LED, one 330 ohm resistor and two jumper wires
    - Lessons 2 to 5 need only a computer with a C compiler such as gcc
  content:
    - section:
        name: Introduction
        content:
          - 00_intro.md
    - section:
        name: Programming Fundamentals
        content:
          - 02_what_is_c.md
          - 03_variables_and_types.md
          - 04_conditionals_and_loops.md
          - 05_functions.md
    - section:
        name: Raspberry Pi Pico Setup
        content:
          - 06_setting_up_toolchain.md
          - 07_first_program.md
    - section:
        name: GPIO Basics
        content:
          - 08_gpio_basics.md
          - 09_blinking_led.md
    - section:
        name: Summary and Next Steps
        content:
          - 10_summary.md
