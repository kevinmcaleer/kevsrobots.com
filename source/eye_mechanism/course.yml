- name: Robot Eye Mechanism
  author: Kevin McAleer
  date_created: 2023-01-28
  date_published: 2023-01-29
  level: intermediate
  layout: course
  cover: assets/eye_mechanism.jpg
  description: >- 
     Design a 3D-printable robot eye mechanism in Fusion 360, with upper and lower eyelids
     that open and close around a central eyeball on a single servo.
  outcomes:
    - Model a curved eyelid in Fusion 360 by revolving a sketch profile
    - Build a hinge with a screw hole using extrude, cut and mirror
    - Organise a design into components and join them with a revolute joint
    - Test the movement of the eyelids on screen
    - Export each eyelid as an STL file ready to 3D print
  prerequisites:
    - Basic computer skills; no earlier course is required
  you_need:
    - A computer that can run Autodesk Fusion 360
    - A free Autodesk account with the educational or hobbyist licence
    - A mouse with a scroll wheel
    - Optional, to print the parts, a 3D printer and a small screw for the hinge pin
  groups:
    - 3ddesign
    - robots
    - 3dprinting
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md 
  - section:
      name: Initial Design
      content:
      - 01_create_component.md
      - 02_create_sketch.md
      - 03_revolve.md
  - section:
      name: Refine the Top Eyelid detail
      content:
      - 04_create_hinges.md
      - 05_hinge.md
  - section:
      name: Create the Lower Eyelid 
      content:
      - 06_lower_eyelid_sketch.md
      - 07_create_lower_sketch.md
      - 08_hinge.md
  - section:
      name: Joints and Export
      content:
      - 09_joint_and_export.md
