- name: Design a SMARS Robot in Fusion 360 - Part 1, The Chassis Shell
  author: Kevin McAleer
  date_created: 2022-07-20
  date_published: 2023-07-20
  level: beginner
  layout: course
  cover: assets/smars_fusion360.png
  groups:
      - 3ddesign
      - 3dprinting
      - robots
  outcomes:
    - Sketch a dimensioned rectangle and turn it into a solid with Extrude
    - Hollow a block with Shell and round its edges with Fillet
    - Cut openings, side shapes, holes and slots through a body with Extrude set to Cut
    - Mirror a feature to the other side of a part
    - Explain why printed parts need wall thickness, rounded edges and clearance holes
  prerequisites:
    - None, no CAD experience needed
    - Helpful but not required, Build a SMARS robot
  you_need:
    - A computer that can run Autodesk Fusion (the free personal-use licence is fine)
    - A mouse with a scroll wheel, which makes orbiting and zooming easier
    - A 3D printer is optional, only to print the finished design
  description: >-
     Design the SMARS robot chassis in Fusion 360, step by step. In Part 1 you sketch
     and extrude the base, shell it, shape the classic SMARS sides and cut the wheel
     holes and Arduino slots.
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Create the Base
      content:
      - 01_base.md
      - 02_extrude_base.md
      - 03_shell.md
      - 04_fillet.md
      - 05_thin.md
  - section:
      name: Refine the Shape
      content:
      - 06_front.md
      - 07_cut.md
      - 08_side.md
      - 09_sidecut.md
      - 10_fillet.md
      - 11_back.md
      - 12_back.md
  - section:
      name: Wheel Holes and Arduino Slots
      content:
      - 13_wheel.md
      - 14_cut.md
      - 15_slots.md
      - 16_cut.md
