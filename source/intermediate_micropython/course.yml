- name: Intermediate level MicroPython
  author: Kevin McAleer
  date_created: 2024-07-07
  date_published: 2024-07-07
  level: intermediate
  layout: course
  cover: assets/cover.png
  prerequisites:
    - The Learn MicroPython - the basics course, or equivalent: variables, loops, functions and the machine.Pin class
  you_need:
    - A Raspberry Pi Pico, Pico W or Pico 2 running MicroPython
    - A computer with Thonny installed
    - A micro USB or USB-C cable that carries data
    - One push button, one LED, a 330 ohm resistor and a breadboard with jumper wires (lessons 11 and 12)
    - A Pico W and Wi-Fi (lesson 9 only)
  outcomes:
    - Design robot code as classes, using inheritance and composition where they help
    - Explain what MicroPython does differently from CPython, and write code that works on a Pico
    - Split a project into modules and packages and install libraries with mip
    - Respond to buttons with pin interrupts and run repeating jobs with timers
    - Copy files to and run code on a board from the command line with mpremote
  groups:
    - micropython
    - python
    - pico
  description: >-
    Take your MicroPython further. Build robot code with classes, inheritance and
    decorators, organise it into modules and packages, respond to the world with
    interrupts and timers, and manage your Pico from the command line with mpremote.
    Every example is checked on MicroPython, not just standard Python.
  content:
    - section:
        name: Introduction
        content:
          - 00_intro.md
    - section:
        name: Object Oriented Programming
        content:
          - 02_oop.md
          - 02a_classes.md
          - 03_abstraction.md
          - 04_inheritance.md
          - 05_encapsulation.md
          - 06_polymorphism.md
    - section:
        name: Decorators
        content:
          - 06a_decorators.md
    - section:
        name: Modules and Packages
        content:
          - 07_modules.md
          - 08_packages.md
          - 09_pypi.md
    - section:
        name: DocStrings
        content:
          - 10_docstrings.md
    - section:
        name: Interrupts and Timers
        content:
          - 11_interrupts.md
          - 12_timers.md
    - section:
        name: MP Remote
        content:
          - 13_mp_remote.md
    - section:
        name: Conclusion
        content:
          - 14_summary.md