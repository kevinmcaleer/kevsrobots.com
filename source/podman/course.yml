- name: From Docker to Podman
  author: Kevin McAleer
  date_created: 2025-05-24
  date_published: 2025-05-24
  level: intermediate
  layout: course
  cover: assets/cover.jpg
  groups:
    - raspberrypi
    - python
  outcomes:
    - Explain what daemonless and rootless mean and why they matter
    - Install Podman on Raspberry Pi OS and run your first container without sudo
    - Build, run, inspect and clean up images and containers with the Podman CLI
    - Group containers into a pod and export it as Kubernetes YAML
    - Run a container as a systemd service that restarts and starts at boot, using Quadlet
    - Migrate a Docker robot status app to Podman
  prerequisites:
    - Docker
    - Introduction to the Linux Command Line on Raspberry Pi OS
  you_need:
    - A Raspberry Pi 4 or 5 running Raspberry Pi OS (64-bit), or another Debian-based Linux PC
    - An internet connection to pull images
    - A terminal, on the Pi itself or over SSH
    - A web browser on any computer on the same network
  description: >-
    Learn how to transition from Docker to Podman and unlock better container workflows 
    with rootless and daemonless architecture. This hands-on course covers everything from 
    architectural differences and CLI compatibility to unique Podman features like systemd integration 
    and Kubernetes support. Perfect for developers and DevOps professionals looking to modernize 
    their container workflows.
  content:
    - section:
        name: Getting Started
        content:
          - 00_intro.md
          - 01_video.md
          - 02_docker_vs_podman_architecture.md
          - 03_installing_podman.md
    - section:
        name: Core Usage
        content:
          - 04_cli_compatibility_and_commands.md
          - 05_podman_unique_features.md
          - 06_managing_containers_and_images.md
    - section:
        name: Advanced Concepts
        content:
          - 07_working_with_pods.md
          - 08_docker_compose_vs_podman_compose.md
          - 09_podman_and_kubernetes.md
    - section:
        name: Real-World Usage
        content:
          - 10_podman_in_production.md
          - 11_troubleshooting_and_debugging.md
    - section:
        name: Migration Lab
        content:
          - 12_migration_project.md
    - section:
        name: Summary
        content:
          - 13_wrap_up_and_future.md
