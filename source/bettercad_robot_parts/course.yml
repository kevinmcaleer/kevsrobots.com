      - 04_cutting_a_pocket.md
  - section:
      name: Mounts
      content:
      - 05_standoffs_for_a_board.md
      - 06_horn_mounts.md
  - section:
      name: Gears and Drives
      content:
      - 07_your_first_gear.md
      - 08_bores_hubs_and_small_gears.md
      - 09_meshing_gears.md
      - 10_racks_pulleys_and_belts.md
  - section:
      name: Parts You Already Have
      content:
      - 11_from_mesh_to_editable_part.md
  - section:
      name: Project
      content:
      - 12_project_geared_servo_deck.md
