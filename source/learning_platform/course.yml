- name: How to use the Learning Platform
  author: Kevin McAleer
  date_created: 2022-11-18
  date_published: 2022-12-04
  level: beginner
  layout: course
  cover: assets/learn.jpg
  description: >-
    A short, friendly guide to the Learn section of KevsRobots.com: find a course,
    follow a learning pathway, run code in your browser, download files, track your
    progress with quizzes, and use it all in a classroom.
  outcomes:
    - Find a course from the Learn page by level, topic or search, and choose a learning pathway
    - Read a course page and a lesson page, and move around them with the sidebar and keyboard
    - Download the files a lesson links to and watch a course's video
    - Run a Python code block in your browser with the play button
    - Answer lesson quizzes, check your progress and finish a course
    - Explain what is saved in your browser and what needs an account
  prerequisites:
    - None. If you can open a web page, you can start here
  you_need:
    - A computer, tablet or phone with a web browser
    - A free account is optional, and only needed to keep progress on more than one device
  groups:
    - productivity
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
      - 01_how_to_use.md
  - section:
      name: Finding and using content
      content:
      - 02_navigate_content.md
      - 03_download_content.md
      - 04_track_progress.md
  - section:
      name: Wrapping up
      content:
      - 05_for_teachers.md
