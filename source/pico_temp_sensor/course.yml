- name: Using the Raspberry Pi Pico's Built-in Temperature Sensor
  author: Kevin McAleer
  date_created: 2024-11-22
  date_published: 2024-11-22
  level: beginner
  layout: course
  cover: assets/cover.jpg
  outcomes:
    - Set up a Raspberry Pi Pico with MicroPython and run programs from Thonny
    - Read the Pico's built-in temperature sensor with the ADC
    - Convert a raw ADC reading to voltage and then to degrees Celsius
    - Smooth noisy readings by averaging and calibrate them with an offset
    - Build a temperature alert that lights the on-board LED
    - Diagnose the common reasons a temperature reading looks wrong
  prerequisites:
    - No programming experience needed
    - Helpful but not required, the MicroPython course
  you_need:
    - A Raspberry Pi Pico, Pico W or Pico 2, and a data-capable USB cable
    - A computer with Thonny installed (we do this in lesson 2)
    - Optional, a room thermometer for calibration and an SSD1306 I2C OLED display
  groups:
    - pico
    - micropython
  description: >-
      Learn how to use the Raspberry Pi Pico's built-in temperature sensor to measure and display temperature readings 
      in the Thonny console. This course is designed for beginners and covers the fundamentals of MicroPython programming, 
      understanding the Pico's ADC, and creating your first temperature monitoring project. 
      Through step-by-step tutorials and practical examples, you'll gain the skills to confidently use the Pico for sensor-based projects.
  content:
    - section:
        name: Introduction to the Raspberry Pi Pico and MicroPython
        content:
          - 00_intro.md
          - 02_setting_up_thonny.md
          - 03_installing_micropython_on_pico.md
    - section:
        name: Understanding the Built-in Temperature Sensor
        content:
          - 04_overview_of_pico_temperature_sensor.md
          - 05_how_the_temperature_sensor_works.md
    - section:
        name: Writing Your First Temperature Sensor Script
        content:
          - 06_reading_temperature_with_adc.md
          - 07_displaying_temperature_in_thonny_console.md
          - 08_formatting_temperature_readings.md
    - section:
        name: Enhancing Your Temperature Monitoring Project
        content:
          - 09_converting_adc_to_temperature.md
          - 10_creating_a_temperature_alert_system.md
    - section:
        name: Project Challenges and Next Steps
        content:
          - 11_project_ideas_and_extensions.md
          - 12_troubleshooting_temperature_readings.md
          - 13_summary_and_next_steps.md
