<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">Partitioned folders by robot and day</title>
  <desc id="desc">A folder tree robot=NAME/day=DATE and how a filter on robot and day skips every other folder.</desc>
  <defs>
    <style>
      .label{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;font-size:14px;fill:#1f2937}
      .small{font-size:12px;fill:#374151}
      .folder{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
      .arrow{stroke:#6b7280;stroke-width:2;marker-end:url(#arrow)}
      .ok{fill:#dcfce7;stroke:#22c55e;stroke-width:2}
      .skip{fill:#fee2e2;stroke:#ef4444;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280" />
    </marker>
  </defs>

  <text x="20" y="24" class="label">lake/readings/</text>

  <!-- year=2023 -->
  <rect x="20" y="40" width="220" height="90" rx="8" class="folder skip"/>
  <text x="30" y="62" class="label">robot=rover-3/</text>
  <text x="40" y="88" class="small">day=2025-03-03/ data_0.parquet</text>
  <text x="40" y="108" class="small">day=2025-03-04/ data_0.parquet</text>

  <!-- year=2024 -->
  <rect x="260" y="40" width="220" height="90" rx="8" class="folder ok"/>
  <text x="270" y="62" class="label">robot=smars-1/</text>
  <text x="280" y="88" class="small">day=2025-03-03/ data_0.parquet</text>
  <text x="280" y="108" class="small">day=2025-03-04/ data_0.parquet</text>

  <!-- year=2025 -->
  <rect x="500" y="40" width="220" height="90" rx="8" class="folder skip"/>
  <text x="510" y="62" class="label">robot=smars-2/</text>
  <text x="520" y="88" class="small">day=2025-03-03/ data_0.parquet</text>
  <text x="520" y="108" class="small">day=2025-03-04/ data_0.parquet</text>

  <!-- Filter arrow -->
  <line x1="340" y1="150" x2="340" y2="210" class="arrow"/>
  <text x="200" y="200" class="small">WHERE robot = 'smars-1' AND day = '2025-03-04'</text>

  <!-- Result -->
  <rect x="280" y="210" width="170" height="30" rx="6" class="ok"/>
  <text x="290" y="230" class="small">scan only smars-1 / 03-04</text>
</svg>
