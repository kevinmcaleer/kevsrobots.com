          - 06_head_body_and_battery.md
          - 07_wiring_the_electronics.md
    - section:
        name: Bring it to life
        content:
          - 08_setting_up_the_pi.md
          - 09_testing_imu_motors_and_controller.md
          - 10_calibration_and_offsets.md
