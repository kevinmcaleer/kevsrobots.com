- name: Reinforcement Learning with Gymnasium
  author: Kevin McAleer
  date_created: 2026-06-14
  date_published: 2026-06-14
  level: intermediate
  layout: course
  cover: assets/cover.jpg
  video: epuO7xpz6i4
  outcomes:
    - Use the current Gymnasium API (reset, step with terminated and truncated, spaces, seeding) with standard environments
    - Explain why terminated and truncated are separate and use each correctly in a Q-learning update
    - Write a custom gym.Env for the BurgerBot grid-world, check it with check_env and register it with gym.make
    - Add behaviour with wrappers and run several environment copies with vector environments
    - Train, evaluate, save and load a Stable-Baselines3 PPO or DQN agent on your own environment
    - Export a trained policy as a JSON lookup table and say honestly what it can and cannot do on a Pico
  prerequisites:
    - The Reinforcement Learning for Beginners course (Q-tables, epsilon-greedy, the BurgerBot grid-world)
    - Python basics such as functions, dictionaries and classes, for example the Introduction to Python course
  you_need:
    - A computer running macOS, Linux or Windows with Python 3.10 or newer and a virtual environment
    - pip install "gymnasium[classic-control]" stable-baselines3 (PyTorch comes with Stable-Baselines3 and is a large download)
    - No robot or other hardware, and no GPU. Tested with Gymnasium 1.4.0 and Stable-Baselines3 2.9.2
  groups:
      - ai
      - python
      - robots
  description: >-
    Take your Q-learning skills to the industry-standard Gymnasium API and
    Stable-Baselines3. You will wrap the BurgerBot grid-world as a proper
    Gymnasium environment, discretize CartPole with your own binning code,
    and train neural-network agents that export a policy table you can drop
    straight onto a Pico.
  content:
    - section:
        name: Introduction
        content:
          - 00_intro.md
    - section:
        name: Why Gymnasium
        content:
          - 01_from_handbuilt_to_standard.md
          - 02_first_environment.md
          - 03_terminated_vs_truncated.md
    - section:
        name: The Gymnasium API in Depth
        content:
          - 04_spaces.md
          - 05_qlearning_on_gymnasium.md
          - 06_seeding_and_lifecycle.md
    - section:
        name: Building Your Own Environment
        content:
          - 07_anatomy_of_custom_env.md
          - 08_wrapping_the_burgerbot.md
          - 09_registering_and_rendering.md
          - 10_wrappers.md
    - section:
        name: Scaling Up to Neural Networks
        content:
          - 11_vectorized_envs.md
          - 12_meet_stable_baselines3.md
          - 13_train_evaluate_export.md
          - 14_summary.md
