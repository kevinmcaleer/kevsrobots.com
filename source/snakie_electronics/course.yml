- name: "Wire It Up - Electronics in Snakie"
  author: Kevin McAleer
  date_created: 2026-11-20
  date_published: 2026-11-20
  level: beginner
  layout: course
  cover: assets/cover.jpg
  groups:
      - micropython
      - pico
      - electronics
      - robots
  description: >-
    Plan a circuit on screen before you touch a wire. Use Snakie's Electronics workspace to pick parts, wire them to a Raspberry Pi Pico, check the wiring for mistakes and print a build guide, then wire and code a two-wheeled obstacle-avoiding robot.
  outcomes:
    - Find any part in the Snakie library and read its pinout
    - Wire a sensor and a motor driver to a Raspberry Pi Pico on screen
    - Explain what power, ground and signal wires do, and why a shared ground matters
    - Use the Electrical Rules Check to catch a short circuit before you build
    - Export a picture, a parts list and a printable PDF build guide
    - Write MicroPython whose pin numbers match your wiring diagram
  prerequisites:
    - Getting Started with Snakie
    - Snakie Blocks - From Blocks to Python (helpful, not required)
  you_need:
    - A web browser, or the Snakie desktop app
    - Nothing else for the on-screen lessons
    - For the real build, a Raspberry Pi Pico, an HC-SR04 sensor, an MX1508 motor driver, two TT motors, a 4xAA battery pack and jumper wires
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
      - 01_the_electronics_workspace.md
  - section:
      name: Parts
      content:
      - 02_the_parts_library.md
      - 03_placing_parts.md
  - section:
      name: Wiring
      content:
      - 04_wiring_with_noodles.md
      - 05_the_schematic_view.md
      - 06_checking_your_wiring.md
  - section:
      name: From Wiring to Code
      content:
