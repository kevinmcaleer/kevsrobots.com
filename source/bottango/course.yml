- name: Bottango Basics
  author: Kevin McAleer
  date_created: 2025-05-03
  date_published: 2025-05-10
  level: beginner
  layout: course
  cover: assets/cover.jpg
  outcomes:
    - Install Bottango and connect an Arduino-compatible board to it
    - Wire servos safely, with a separate power supply and a common ground
    - Create a motion with keyframes and easing in the Bottango timeline
    - Add audio and time movements to it
    - Control servos live with a gamepad using a control scheme
    - Export an animation so the board can play it without the computer
  prerequisites:
    - Helpful but not required, Electronics basics
    - No coding experience is needed
  you_need:
    - A Windows, Mac or Linux computer
    - An Arduino Uno R3 or an ESP32 board, and a data-capable USB cable
    - One to three hobby servos such as SG90 or MG90S
    - A separate 5V power supply for the servos, and jumper wires
    - Optional, a USB gamepad, and the Arduino IDE
  groups:
      - arduino
      - robots
  description: >-
    Learn how to bring characters and props to life using Bottango, a powerful no-code motion tool for animating servos and creating interactive scenes. 
    This course walks you through installing Bottango, wiring servos, programming boards, and creating expressive motion sequences.
  content:
    - section:
        name: Introduction
        content:
          - 00_intro.md
    - section:
        name: Getting Started
        content:
          - 01_install.md
          - 02_setup_board.md
    - section:
        name: Wiring and Configuration
        content:
          - 03_wiring.md
          - 04_configure_bottango.md
    - section:
        name: Creating Animations
        content:
          - 05_create_motion.md
          - 06_triggers.md
          - 07_sync_music.md
    - section:
        name: Advanced Projects
        content:
          - 08_arduino_mode.md
          - 09_use_with_gamepad.md
    - section:
        name: Summary
        content:
          - 10_summary.md
