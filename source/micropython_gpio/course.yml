- name: Raspberry Pi Pico with MicroPython - GPIO Mastery
  author: Kevin McAleer
  date_created: 2023-04-13
  date_published: 2023-04-14
  level: beginner
  layout: course
  cover: assets/raspberry_pi_pico_gpio.jpg
  groups:
      - micropython
      - gpio
      - pico
  description: >- 
     Master the use of GPIO pins on the Raspberry Pi Pico with MicroPython. Learn about various types of pins, their functions, and how to work with them in real-world projects.
  outcomes:
    - Find any Pico pin on the pinout and use the right GP number in MicroPython
    - Wire LEDs, buttons and potentiometers safely, with resistor values worked out
    - Use PWM to fade an LED, set motor speed and position a servo
    - Read analog voltages with the ADC and turn them into volts
    - Talk to other chips and modules over UART, I2C and SPI
    - Protect the Pico from 5V signals with a divider or level shifter
  prerequisites:
    - Learn MicroPython - The basics (/learn/micropython/)
  you_need:
    - A Raspberry Pi Pico or Pico W with MicroPython installed
    - A USB cable and a computer running Thonny
    - A breadboard and jumper wires
    - LEDs, 220 ohm resistors and a push button
    - A 10k potentiometer
    - An L293D motor driver, a small DC motor and a battery pack (lesson 7 only)
    - An SG90 servo (lesson 14 only)
    - An HC-SR04 range finder with 1k and 2k resistors (lesson 15 only)
    - A DS18B20 or DHT11 temperature sensor (lesson 10, optional)
  content:
  - section:
      name: Overview
      content:
      - 00_intro.md
  - section:
      name: Introduction to GPIO Pins
      content:
      - 01_gpio_pin_types.md
      - 02_pin_numbering.md
      - 03_voltage_levels.md
  - section:
      name: Digital I/O and PWM
      content:
      - 04_digital_io.md
      - 05_pwm.md
      - 06_leds.md
      - 07_motors.md
  - section:
      name: Analog I/O (ADC)
      content:
      - 08_adc.md
      - 09_potentiometers.md
      - 10_temperature_sensors.md
  - section:
      name: UART, I2C, and SPI
      content:
      - 11_uart.md
      - 12_i2c.md
      - 13_spi.md
  - section:
      name: Interfacing with Servos and Ultrasonic Range Finders
      content:
      - 14_servos.md
      - 15_ultrasonic_range_finders.md
  - section:
      name: Ground Pins
      content:
      - 16_ground_pins.md
  - section:
      name: Summary and Review
      content:
      - 17_summary.md
