<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="All four MeshCore roles working together: clients, a repeater, a room server and a sensor node">
  <defs>
    <style>
      .bg{fill:#16202b}
      .title{font:700 30px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef5}
      .sub{font:400 18px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#9fb3c8}
      .lbl{font:700 18px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef5}
      .sm{font:400 14px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#9fb3c8}
      .tag{font:700 12px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#16202b}
    </style>
  </defs>
  <rect class="bg" width="1200" height="540"/>
  <text class="title" x="40" y="52">One mesh, four jobs</text>
  <text class="sub" x="40" y="84">Part 1 built the blue nodes. Part 2 builds the green ones.</text>

  <!-- links -->
  <g stroke="#3d5570" stroke-width="3" fill="none">
    <path d="M215,300 L560,220"/>
    <path d="M215,410 L560,240"/>
    <path d="M640,220 L960,150"/>
    <path d="M640,250 L960,400"/>
  </g>

  <!-- repeater centre -->
  <g transform="translate(600,232)">
    <circle r="62" fill="#1f2c3a" stroke="#f7b32b" stroke-width="3"/>
    <rect x="-30" y="-18" width="60" height="36" rx="7" fill="#16202b" stroke="#f7b32b" stroke-width="2.5"/>
    <rect x="-18" y="-8" width="36" height="12" rx="3" fill="#f7b32b" opacity="0.9"/>
    <path d="M0,-18 L0,-48" stroke="#f7b32b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-52" r="4" fill="#f7b32b"/>
  </g>
  <text class="lbl" x="600" y="326" text-anchor="middle" fill="#f7b32b">Repeater</text>
  <text class="sm" x="600" y="348" text-anchor="middle">Part 1 · forwards packets</text>

  <!-- clients left -->
  <g transform="translate(150,300)">
    <rect x="-52" y="-30" width="104" height="60" rx="10" fill="#1f2c3a" stroke="#4cc9f0" stroke-width="3"/>
    <rect x="-34" y="-16" width="52" height="16" rx="4" fill="#4cc9f0" opacity="0.9"/>
    <rect x="26" y="-20" width="18" height="34" rx="4" fill="#0f1a24" stroke="#4cc9f0" stroke-width="2"/>
  </g>
  <text class="lbl" x="150" y="356" text-anchor="middle" fill="#4cc9f0">Client A</text>
  <text class="sm" x="150" y="378" text-anchor="middle">Part 1 · your phone</text>

  <g transform="translate(150,440)">
    <rect x="-52" y="-30" width="104" height="60" rx="10" fill="#1f2c3a" stroke="#4cc9f0" stroke-width="3"/>
    <rect x="-34" y="-16" width="52" height="16" rx="4" fill="#4cc9f0" opacity="0.9"/>
    <rect x="26" y="-20" width="18" height="34" rx="4" fill="#0f1a24" stroke="#4cc9f0" stroke-width="2"/>
  </g>
  <text class="lbl" x="150" y="496" text-anchor="middle" fill="#4cc9f0">Client B</text>
  <text class="sm" x="150" y="518" text-anchor="middle">Part 1 · a friend</text>

  <!-- room server -->
  <g transform="translate(1010,140)">
    <rect x="-62" y="-44" width="124" height="88" rx="12" fill="#1f2c3a" stroke="#7ee787" stroke-width="3"/>
    <rect x="-44" y="-28" width="88" height="10" rx="5" fill="#7ee787" opacity="0.9"/>
    <rect x="-44" y="-10" width="70" height="10" rx="5" fill="#3d5570"/>
    <rect x="-44" y="8" width="80" height="10" rx="5" fill="#7ee787" opacity="0.6"/>
    <rect x="-44" y="26" width="56" height="10" rx="5" fill="#3d5570"/>
  </g>
  <rect x="880" y="52" width="122" height="26" rx="13" fill="#7ee787"/>
  <text class="tag" x="894" y="70">THIS COURSE</text>
  <text class="lbl" x="1016" y="72" fill="#7ee787">Room Server</text>
  <text class="sm" x="880" y="212">Keeps recent posts. Hands them over</text>
  <text class="sm" x="880" y="232">when you come back into range.</text>

  <!-- sensor -->
  <g transform="translate(1010,400)">
    <rect x="-62" y="-38" width="124" height="76" rx="12" fill="#1f2c3a" stroke="#7ee787" stroke-width="3"/>
    <path d="M-34,14 L-34,-8 a10,10 0 0 1 20,0 L-14,14" fill="none" stroke="#7ee787" stroke-width="3"/>
    <circle cx="-24" cy="16" r="9" fill="#7ee787"/>
    <text x="6" y="-2" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e8eef5">4.2°C</text>
    <text x="6" y="20" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3c8">3.9V</text>
  </g>
  <rect x="880" y="470" width="122" height="26" rx="13" fill="#7ee787"/>
  <text class="tag" x="894" y="488">THIS COURSE</text>
  <text class="lbl" x="1016" y="490" fill="#7ee787">Sensor</text>
  <text class="sm" x="880" y="330">Measures somewhere you are not.</text>
  <text class="sm" x="880" y="350">Answers when asked. A leaf by default.</text>
</svg>
